version: 2
updates:
  # Python (the v2 package + dev tooling, via pyproject.toml + requirements-dev.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    assignees:
      - "csmarshall"
    open-pull-requests-limit: 99

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    assignees:
      - "csmarshall"
    open-pull-requests-limit: 99

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
    assignees:
      - "csmarshall"
    open-pull-requests-limit: 99
