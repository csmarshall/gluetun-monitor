name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # We declare requires-python >=3.13, so test the range we support — and this
      # is what lets us safely bump the image's base Python (e.g. to 3.14).
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + pinned dev tooling
        # requirements-dev.txt holds the exact dev-tool versions (Dependabot-tracked,
        # auto-merged on green); the package itself comes from the local checkout.
        run: pip install -e . -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check gluetun_monitor tests

      - name: Mypy (strict types)
        run: mypy gluetun_monitor

      - name: pip-audit (dependency CVEs)
        run: |
          pip install pip-audit
          pip-audit

      - name: Pytest (incl. differential vs. legacy bash)
        # Floor is set below the current ~99% so a real regression fails the build
        # without flaking on trivial churn.
        run: pytest --cov=gluetun_monitor --cov-report=term-missing --cov-fail-under=95

  shellcheck:
    name: Shellcheck (legacy script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          format: tty

  bats:
    name: Bats (legacy regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run legacy bats tests
        run: bats tests/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: gluetun-monitor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t gluetun-monitor:test .

      - name: Test container starts (direct socket)
        run: |
          # Create minimal config
          echo "https://www.google.com" > sites.conf

          # Start container (will fail without gluetun, but should start)
          docker run -d --name test-monitor \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v $(pwd)/sites.conf:/config/sites.conf:ro \
            -e GLUETUN_CONTAINER=nonexistent \
            gluetun-monitor:test || true

          # Give it a moment to start
          sleep 3

          # Check logs for expected startup message
          docker logs test-monitor 2>&1 | grep -q "Gluetun Monitor starting"

          # Cleanup
          docker stop test-monitor || true
          docker rm test-monitor || true

      - name: Test container starts (socket proxy)
        run: |
          # Create an isolated network for the proxy
          docker network create test-docker-proxy

          # Start socket proxy with required permissions
          docker run -d --name test-socket-proxy \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e CONTAINERS=1 -e POST=1 -e EXEC=1 \
            --network test-docker-proxy \
            tecnativa/docker-socket-proxy

          # Wait for proxy to be ready
          sleep 3

          # Start monitor using socket proxy
          docker run -d --name test-monitor-proxy \
            -v $(pwd)/sites.conf:/config/sites.conf:ro \
            -e DOCKER_HOST=tcp://test-socket-proxy:2375 \
            -e GLUETUN_CONTAINER=nonexistent \
            --network test-docker-proxy \
            gluetun-monitor:test || true

          # Give it a moment to start
          sleep 3

          # Check logs for expected startup via proxy
          docker logs test-monitor-proxy 2>&1 | grep -q "Gluetun Monitor starting"

          # Cleanup
          docker stop test-monitor-proxy test-socket-proxy || true
          docker rm test-monitor-proxy test-socket-proxy || true

      - name: Test PUID/PGID drops privileges and chowns /logs
        run: |
          # Default (no PUID) runs as root = drop-in; setting PUID/PGID opts into
          # non-root: the entrypoint chowns the /logs mount to that uid and drops.
          echo "https://www.google.com" > sites.conf
          mkdir -p puidlogs
          docker run --rm \
            -v $(pwd)/sites.conf:/config/sites.conf:ro \
            -v $(pwd)/puidlogs:/logs \
            -e DOCKER_HOST=tcp://127.0.0.1:1 \
            -e GLUETUN_CONTAINER=nonexistent \
            -e PUID=1000 -e PGID=1000 \
            gluetun-monitor:test > puid.log 2>&1 || true

          # Banner still prints (it started)...
          grep -q "Gluetun Monitor starting" puid.log
          # ...and the entrypoint chowned the mount to PUID before dropping.
          test "$(stat -c %u ./puidlogs)" = "1000"
          docker network rm test-docker-proxy || true
