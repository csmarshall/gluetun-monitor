name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repo (lint, test, build-without-push). No job needs write.
permissions:
  contents: read

jobs:
  runtime-python:
    name: Resolve runtime Python from the Dockerfile
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.read.outputs.runtime }}
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: read
        # SINGLE SOURCE OF TRUTH for the Python version: the base image
        # (FROM python:X.Y-slim in the Dockerfile). Every setup-python job below
        # derives from this, so a base bump (3.14 → 3.15 → …) is a one-line Dockerfile
        # change with no other edits — nothing can test/resolve against a version the
        # image doesn't ship.
        #
        # `runtime` = that one version (lint/type/test coverage floor, lock-audit, and
        # the real-daemon integration all use it). `versions` = the test matrix,
        # normally just [runtime]. During a base bump, widen `versions` HERE to
        # validate the candidate alongside the current (e.g. ["3.14","3.15"]) before
        # switching the Dockerfile FROM, then drop the old.
        run: |
          runtime="$(grep -oP 'FROM python:\K[0-9]+\.[0-9]+' Dockerfile | head -1)"
          if [ -z "${runtime}" ]; then
            echo "::error::could not read 'FROM python:X.Y' from the Dockerfile"; exit 1
          fi
          echo "runtime=${runtime}" >> "$GITHUB_OUTPUT"
          echo "versions=[\"${runtime}\"]" >> "$GITHUB_OUTPUT"

  python:
    name: Python (lint, types, tests)
    needs: runtime-python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Matrix comes from the Dockerfile via runtime-python (single source of truth) —
      # to test a candidate during a base bump, widen `versions` there, not here.
      matrix:
        python-version: ${{ fromJSON(needs.runtime-python.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: requirements.lock direct pins match pyproject
        # The image installs runtime deps from the hashed requirements.lock, so a
        # bump in pyproject that didn't regenerate the lock would silently NOT reach
        # the image (and silently break the docker-py/apprise auto-merge promotion).
        # Fail closed: assert the lock's direct pins equal pyproject's. (The deeper
        # "lock is faithful to the runtime" check is the lock-audit job below.) Regenerate
        # in the runtime interpreter, NOT a host python — see scripts/regen-lock.sh.
        run: |
          for pkg in docker apprise; do
            want=$(grep -oP "(?<=\"${pkg}==)[0-9][0-9.]*" pyproject.toml | head -1)
            got=$(grep -oP "^${pkg}==\K[0-9][0-9.]*" requirements.lock | head -1)
            if [ "$want" != "$got" ]; then
              echo "::error::requirements.lock is stale: ${pkg} is ${got:-missing} in the lock but ${want} in pyproject.toml"
              exit 1
            fi
          done
          echo "requirements.lock direct pins in sync"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + pinned dev tooling
        # requirements-dev.txt holds the exact dev-tool versions (Dependabot-tracked,
        # auto-merged on green); the package itself comes from the local checkout.
        run: pip install -e . -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check gluetun_monitor tests

      - name: Mypy (strict types)
        run: mypy gluetun_monitor

      - name: pip-audit (dependency CVEs)
        # pip-audit scans the whole environment, including the runner's bundled
        # build tooling (pip/setuptools/wheel) that we don't ship. A freshly
        # published advisory against that tooling — e.g. PYSEC-2026-196 against the
        # runner's pip — would otherwise turn the build red on something outside our
        # control. Upgrade the tooling first so only our actual dependency tree
        # (docker + transitives) gates the build. If a toolchain advisory ever lands
        # with no fix yet, add a scoped `--ignore-vuln <ID>` here with a removal note.
        run: |
          # pip-audit itself is pinned in requirements-dev.txt (installed above,
          # Dependabot-tracked) — no ad-hoc install here.
          python -m pip install --upgrade pip setuptools wheel
          pip-audit

      - name: Pytest (incl. differential vs. legacy bash)
        # Floor is set below the current ~99% so a real regression fails the build
        # without flaking on trivial churn. `not integration` excludes the
        # real-daemon suite (it runs in its own job below).
        run: pytest -m "not integration" --cov=gluetun_monitor --cov-report=term-missing --cov-fail-under=95

  lock-audit:
    name: requirements.lock faithful to the runtime Python
    needs: runtime-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ needs.runtime-python.outputs.runtime }}
        # Resolved from the Dockerfile by runtime-python, so this can never validate
        # the lock against a different interpreter than the image ships (#82).
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ needs.runtime-python.outputs.runtime }}

      - name: Assert the committed lock == a fresh pip-compile under that version
        # #82: exercises requirements.lock (nothing did before) and pins it to the
        # runtime. pip-compile resolves environment markers against the interpreter it
        # runs under, so a lock frozen under a different version can pin different
        # transitives. Compares only the resolved pins/hashes (the comment header —
        # Python version, invocation — is stripped), so it fails on real dependency
        # drift, not cosmetic header text.
        run: |
          pip install pip-tools==7.5.3
          cp requirements.lock /tmp/committed.lock
          pip-compile --quiet --generate-hashes --output-file=requirements.lock pyproject.toml
          if ! diff -u <(grep -v '^#' /tmp/committed.lock) <(grep -v '^#' requirements.lock); then
            echo "::error::requirements.lock is stale for the runtime Python. Regenerate with ./scripts/regen-lock.sh"
            exit 1
          fi
          echo "requirements.lock matches pyproject.toml resolved under Python ${{ needs.runtime-python.outputs.runtime }}"

  pytest-integration:
    name: Integration (real daemon, pytest)
    needs: runtime-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ needs.runtime-python.outputs.runtime }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ needs.runtime-python.outputs.runtime }}

      - name: Install package + pinned dev tooling
        run: pip install -e . -r requirements-dev.txt

      - name: Run real-daemon integration tests
        # ubuntu-latest ships a running dockerd, so these drive the real
        # DockerPyClient — exec/inspect/restart and the non-destructive recreate
        # (incl. volume survival) against a live daemon (issue #24). This is the
        # bar that must stay green before docker-py minors may be auto-merged.
        run: pytest -m integration -p no:cacheprovider

  shellcheck:
    name: Shellcheck (legacy script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: '.'
          format: tty

  bats:
    name: Bats (legacy regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run legacy bats tests
        run: bats tests/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: gluetun-monitor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build -t gluetun-monitor:test .

      - name: Test container starts (direct socket)
        run: |
          # Create minimal config
          echo "https://www.google.com" > sites.conf

          # Start container (will fail without gluetun, but should start)
          docker run -d --name test-monitor \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v $(pwd)/sites.conf:/config/sites.conf:ro \
            -e GLUETUN_CONTAINER=nonexistent \
            gluetun-monitor:test || true

          # Give it a moment to start
          sleep 3

          # Check logs for expected startup message
          docker logs test-monitor 2>&1 | grep -q "Gluetun Monitor starting"

          # Cleanup
          docker stop test-monitor || true
          docker rm test-monitor || true

      - name: Test container starts (socket proxy)
        run: |
          # Create an isolated network for the proxy
          docker network create test-docker-proxy

          # Start socket proxy with required permissions.
          # Digest-pinned; kept current by .github/workflows/socket-proxy-drift.yml
          # (opens a refresh PR on upstream re-publish — this image doesn't ship in
          # ours, so it's tracked via PR, not a release like the python base).
          docker run -d --name test-socket-proxy \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e CONTAINERS=1 -e POST=1 -e EXEC=1 \
            --network test-docker-proxy \
            tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476

          # Wait for proxy to be ready
          sleep 3

          # Start monitor using socket proxy
          docker run -d --name test-monitor-proxy \
            -v $(pwd)/sites.conf:/config/sites.conf:ro \
            -e DOCKER_HOST=tcp://test-socket-proxy:2375 \
            -e GLUETUN_CONTAINER=nonexistent \
            --network test-docker-proxy \
            gluetun-monitor:test || true

          # Give it a moment to start
          sleep 3

          # Check logs for expected startup via proxy
          docker logs test-monitor-proxy 2>&1 | grep -q "Gluetun Monitor starting"

          # Cleanup
          docker stop test-monitor-proxy test-socket-proxy || true
          docker rm test-monitor-proxy test-socket-proxy || true

      - name: Test PUID/PGID drops privileges and chowns /logs
        run: |
          # Default (no PUID) runs as root = drop-in; setting PUID/PGID opts into
          # non-root: the entrypoint chowns the /logs mount to that uid and drops.
          echo "https://www.google.com" > sites.conf
          mkdir -p puidlogs
          docker run --rm \
            -v $(pwd)/sites.conf:/config/sites.conf:ro \
            -v $(pwd)/puidlogs:/logs \
            -e DOCKER_HOST=tcp://127.0.0.1:1 \
            -e GLUETUN_CONTAINER=nonexistent \
            -e PUID=1000 -e PGID=1000 \
            gluetun-monitor:test > puid.log 2>&1 || true

          # Banner still prints (it started)...
          grep -q "Gluetun Monitor starting" puid.log
          # ...and the entrypoint chowned the mount to PUID before dropping.
          test "$(stat -c %u ./puidlogs)" = "1000"
          docker network rm test-docker-proxy || true
