name: Dependabot auto-merge

# Enable auto-merge for LOW-RISK Dependabot PRs only.
#
# We deliberately do NOT cast an approving review: branch protection here does not
# require reviews, and letting GITHUB_TOKEN self-approve is both disallowed by
# default ("Allow GitHub Actions to approve pull requests" is off, correctly) and
# a review-bypass anti-pattern. Enabling auto-merge is all that's needed.
#
# "Auto-merge" still waits for every required status check (the 3.13/3.14 test
# matrix, shellcheck, bats, build, integration) to go green — so a bump that
# breaks anything fails its own CI and stays open for a human. This workflow only
# widens *which already-green PRs* merge without a manual click; it never bypasses
# the gate. (Requires repo "Allow auto-merge" + branch protection with required
# checks — see issue #23 / CONTRIBUTING.)
#
# In scope (fast-tracked, patch + minor):
#   • dev tooling — ruff / mypy / pytest / pytest-cov (pip, direct:development)
#   • the runtime prod libs (pip, direct:production): `docker` and `apprise` —
#     each is exercised for real by a required check (docker by the real-daemon
#     job #24; apprise by the localhost-sink test #22), so a regression turns CI
#     red and green means runtime-safe
#   • github-actions
# Held for human review (never auto-merged):
#   • any MAJOR bump
#   • the Docker base image (python:3.x-slim) — a 3.x→3.y jump needs a CI-matrix
#     change + manual validation (cf. #32), so it always gets eyes

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge (squash) for in-scope updates
        if: >
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          ((steps.meta.outputs.package-ecosystem == 'pip' &&
            (steps.meta.outputs.dependency-type == 'direct:development' ||
             steps.meta.outputs.dependency-type == 'direct:production')) ||
           steps.meta.outputs.package-ecosystem == 'github_actions')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
